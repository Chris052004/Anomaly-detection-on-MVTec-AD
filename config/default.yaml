image_size: 256  # fisso: l'architettura ConvAutoencoder è cablata per 256x256
latent_dim: 100
noise_std: 0.1
use_denoising: true
loss_mode: ssim_mse
ssim_weight: 0.85
mse_weight: 0.15
batch_size: 32
learning_rate: 0.001
max_epochs: 200
early_stopping_patience: 20
early_stopping_min_delta: 0.0001
lr_scheduler_patience: 10
lr_scheduler_factor: 0.5
val_split: 0.1
seed: 42
threshold_percentile: 95.0
